name: ci

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: amrutam, POSTGRES_PASSWORD: amrutam, POSTGRES_DB: amrutam_test, TZ: UTC }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U amrutam" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://amrutam:amrutam@localhost:5432/amrutam_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env: { DATABASE_URL: "${{ env.TEST_DATABASE_URL }}" }
      - name: Type-check (source and tests)
        run: npx tsc --noEmit -p tsconfig.tests.json
      - name: Tests with coverage (fails below the thresholds in vitest.config.mts)
        run: npx vitest run --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage/lcov.info }

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3

  image:
    runs-on: ubuntu-latest
    needs: [test, security]
    permissions: { contents: read, packages: write, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (loaded locally so it can be scanned before anything is pushed)
        uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "amrutam-backend:${{ github.sha }}", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with: { image-ref: "amrutam-backend:${{ github.sha }}", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - name: Push to GitHub Container Registry (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag amrutam-backend:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag amrutam-backend:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  deploy:
    # Turn on by setting the repository variable DEPLOY_ENABLED=true and the secret KUBE_CONFIG (base64 kubeconfig).
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube && echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Migrate, then roll out
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}
          kubectl -n amrutam delete job amrutam-migrate --ignore-not-found
          sed "s#ghcr.io/OWNER/amrutam-backend:latest#$IMAGE#" infra/k8s/10-migrate-job.yaml | kubectl apply -f -
          kubectl -n amrutam wait --for=condition=complete job/amrutam-migrate --timeout=300s
          kubectl -n amrutam set image deployment/amrutam-api api=$IMAGE
          kubectl -n amrutam set image deployment/amrutam-worker worker=$IMAGE
          kubectl -n amrutam rollout status deployment/amrutam-api --timeout=300s
          kubectl -n amrutam rollout status deployment/amrutam-worker --timeout=300s
