global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: amrutam-api
    metrics_path: /metrics
    # if you set METRICS_TOKEN, add:  authorization: { credentials: <token> }
    static_configs: [{ targets: ["api:3000"] }]
  - job_name: amrutam-worker
    static_configs: [{ targets: ["worker:9101"] }]
